<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#118B6B" />
    <title>Reabastecimiento</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello blanco.
      try {
        var t = JSON.parse(localStorage.getItem('ajustes') || '{}').tema
        if (t === 'oscuro' || t === 'claro') document.documentElement.dataset.theme = t === 'oscuro' ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
